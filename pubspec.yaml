name: smart_match
description: "TSUNAGU - 日本限定の多目的コミュニケーションアプリ (恋愛/友達/仕事/学び/趣味)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: 6.1.5+1
  shared_preferences: 2.5.3
  http: 1.5.0

  # Firebase (LOCKED versions for stability)
  firebase_core: 3.6.0
  cloud_firestore: 5.4.3
  firebase_auth: 5.3.1
  firebase_storage: 12.3.2
  google_sign_in: 6.2.1

  # LINE login (external browser / web redirect)
  url_launcher: ^6.3.0

  # Image handling for profile photos
  image_picker: ^1.1.2

  # Location services (GPS for prefecture auto-detection)
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  geocoding: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
