<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TSUNAGU - 日本限定マルチパーパス・コミュニケーションアプリ">
  <meta name="theme-color" content="#E63946">

  <!-- Disable caching during development -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TSUNAGU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TSUNAGU — つなぐ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1A1A1A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      /* iOS Safari でスワイプジェスチャーを Flutter に優先させる */
      overscroll-behavior: none;
      -webkit-overflow-scrolling: auto;
      overflow: hidden;
      position: fixed;
      width: 100%;
      touch-action: pan-y;
    }

    /* Flutter のレンダリングコンテナ */
    flt-glass-pane, flutter-view {
      touch-action: none !important;
    }

    /* Splash screen shown until Flutter loads */
    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1A1A1A;
      z-index: 9999;
      transition: opacity 0.6s ease-out;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash-logo {
      width: 96px;
      height: 96px;
      animation: logoPulse 2.4s ease-in-out infinite;
    }

    #splash-brand {
      color: white;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 6px;
      margin-top: 28px;
    }

    #splash-tagline {
      color: #E63946;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 3px;
      margin-top: 8px;
    }

    #splash-loader {
      position: absolute;
      bottom: 60px;
      width: 120px;
      height: 2px;
      background: rgba(255,255,255,0.1);
      overflow: hidden;
      border-radius: 1px;
    }

    #splash-loader::before {
      content: '';
      position: absolute;
      width: 30%;
      height: 100%;
      background: #E63946;
      animation: loaderSlide 1.4s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.85; }
    }

    @keyframes loaderSlide {
      0% { left: -30%; }
      100% { left: 100%; }
    }
  </style>

  <script>
    // Unregister any existing service workers to bust stale caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }


  </script>
</head>
<body>
  <!-- Custom splash screen with TSUNAGU branding -->
  <div id="splash">
    <img id="splash-logo" src="assets/assets/icons/tsunagu_icon.png" alt="TSUNAGU">
    <div id="splash-brand">TSUNAGU</div>
    <div id="splash-tagline">CONNECT WITH PEOPLE IN JAPAN</div>
    <div id="splash-loader"></div>
  </div>

  <script>
    // Disable Flutter service worker registration to prevent caching issues
    window.flutterConfiguration = {
      serviceWorker: null
    };

    // Hide splash once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 700);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
